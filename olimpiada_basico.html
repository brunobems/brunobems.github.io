<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpíada de Literatura - Básico</title>
</head>

<body>
    <h1>🏆 Olimpíada de Literatura - Perigoso</h1>
    <p>Nível Básico - 20 questões</p>
    <script>
        const questoes = [
           
    {
        pergunta: "Qual é o nome da toupeira protagonista da história?",
        opcoes: ["Tom", "Bob", "Leo", "Max"],
        correta: 1,
        explicacao: "O protagonista é Bob, uma toupeira curiosa que adora etiquetar tudo."
    },
    {
        pergunta: "O que Bob gosta de fazer?",
        opcoes: ["Cavar buracos", "Etiquetar objetos", "Dormir", "Caçar insetos"],
        correta: 1,
        explicacao: "Bob tem mania de etiquetar tudo ao seu redor."
    },
    {
        pergunta: "Que objeto misterioso Bob encontra?",
        opcoes: ["Uma caixa", "Um chapéu", "Um livro", "Uma mala"],
        correta: 1,
        explicacao: "Bob encontra um chapéu com a etiqueta 'PERIGO! NÃO TOQUE!'."
    },
    {
        pergunta: "O que acontece quando Bob toca o chapéu?",
        opcoes: ["Nada", "Sai um crocodilo", "Saltam coelhos", "Ele desaparece"],
        correta: 2,
        explicacao: "Ao tocar o chapéu, vários coelhos saltam de dentro dele."
    },
    {
        pergunta: "Qual era a etiqueta no chapéu?",
        opcoes: ["Cuidado!", "Perigo! Não toque!", "Frágil", "Proibido abrir"],
        correta: 1,
        explicacao: "A etiqueta dizia 'PERIGO! NÃO TOQUE!'."
    },
    {
        pergunta: "O que Bob pensa dos coelhos inicialmente?",
        opcoes: ["Que são perigosos", "Que são engraçados", "Que são amigos", "Que são mágicos"],
        correta: 0,
        explicacao: "Bob acredita que os coelhos podem ser perigosos."
    },
    {
        pergunta: "Os coelhos eram realmente perigosos?",
        opcoes: ["Sim", "Não", "Alguns sim", "Não se sabe"],
        correta: 1,
        explicacao: "Os coelhos eram inofensivos e brincalhões."
    },
    {
        pergunta: "Quem é o amigo escamoso de Bob?",
        opcoes: ["Um lagarto", "Um crocodilo", "Uma cobra", "Um dragão"],
        correta: 1,
        explicacao: "O amigo escamoso de Bob é um crocodilo."
    },
    {
        pergunta: "Como os outros animais viam o crocodilo?",
        opcoes: ["Como perigoso", "Como engraçado", "Como sábio", "Como preguiçoso"],
        correta: 0,
        explicacao: "Os animais achavam que o crocodilo era perigoso por sua aparência."
    },
    {
        pergunta: "Qual é a principal mensagem do livro?",
        opcoes: ["Não confiar em ninguém", "Julgar pelas aparências", "Aceitar as diferenças", "Evitar aventuras"],
        correta: 2,
        explicacao: "O livro ensina sobre aceitação e não julgar pelas aparências."
    },
    {
        pergunta: "O que os coelhos trazem para a história?",
        opcoes: ["Medo", "Confusão e diversão", "Tristeza", "Silêncio"],
        correta: 1,
        explicacao: "Os coelhos causam confusão, mas também diversão."
    },
    {
        pergunta: "Qual é o gênero do livro?",
        opcoes: ["Romance", "Infantil", "Suspense", "História real"],
        correta: 1,
        explicacao: "O livro é uma obra infantil ilustrada."
    },
    {
        pergunta: "Quem escreveu o livro?",
        opcoes: ["Tim Warnes", "Monteiro Lobato", "Maurice Sendak", "Ana Maria Machado"],
        correta: 0,
        explicacao: "O autor é Tim Warnes."
    },
    {
        pergunta: "Qual é o público-alvo do livro?",
        opcoes: ["Adultos", "Adolescentes", "Crianças", "Professores"],
        correta: 2,
        explicacao: "O livro é voltado para crianças entre 5 e 8 anos."
    },
    {
        pergunta: "O que Bob aprende no final?",
        opcoes: ["Que etiquetas sempre estão certas", "Que nem tudo é perigoso", "Que deve fugir dos coelhos", "Que deve parar de etiquetar"],
        correta: 1,
        explicacao: "Bob aprende que nem tudo é perigoso e que rótulos podem enganar."
    },
    {
        pergunta: "Qual é o tom da narrativa?",
        opcoes: ["Triste", "Assustador", "Humorístico", "Sério"],
        correta: 2,
        explicacao: "A narrativa é leve e humorística."
    },
    {
        pergunta: "O que o crocodilo representa na história?",
        opcoes: ["O perigo real", "A diferença", "A liderança", "A confusão"],
        correta: 1,
        explicacao: "O crocodilo representa a ideia de ser diferente sem ser perigoso."
    },
    {
        pergunta: "O que Bob usava para identificar objetos?",
        opcoes: ["Cores", "Etiquetas", "Desenhos", "Números"],
        correta: 1,
        explicacao: "Bob usava etiquetas para identificar tudo."
    },
    {
        pergunta: "O que os coelhos mostram para Bob?",
        opcoes: ["Que o chapéu era mágico", "Que ele estava errado", "Que deviam fugir", "Que eram perigosos"],
        correta: 1,
        explicacao: "Os coelhos mostram que Bob estava errado em acreditar no rótulo."
    },
    {
        pergunta: "Qual é a lição final do livro?",
        opcoes: ["Sempre confiar em etiquetas", "Evitar chapéus misteriosos", "Aceitar o inesperado com alegria", "Nunca brincar com coelhos"],
        correta: 2,
        explicacao: "A lição é aceitar o inesperado e não julgar pelas aparências."
    }




        ];
        document.write('<form>'); questoes.forEach((q, i) => { document.write('<h3>' + (i + 1) + '. ' + q.pergunta + '</h3>'); q.opcoes.forEach((o, j) => document.write('<label><input type=radio name=q' + i + ' value=' + j + '>' + o + '</label><br>')); document.write('<div id=e' + i + '></div><hr>'); }); document.write('</form><button onclick="corrigir()">Finalizar basico</button><div id=res></div>'); function corrigir() { let p = 0; questoes.forEach((q, i) => { let r = document.querySelector('input[name=q' + i + ']:checked'); let e = document.getElementById('e' + i); if (r && +r.value === q.correta) { p++; e.innerHTML = '✅ ' + q.explicacao } else { e.innerHTML = '❌ ' + q.explicacao } }); document.getElementById('res').innerHTML = 'Acertos: ' + p + '/' + questoes.length; }
    </script>

    



</body>

</html>
