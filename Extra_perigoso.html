<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpíada de Literatura - Básico</title>
</head>

<body>
    <h1>🏆 Olimpíada de Literatura - Perigoso</h1>
    <p>Nível Médio - 20 questões</p>
    <script>
        const questoes = [
    {
        pergunta: "Por que Bob sente necessidade de colocar etiquetas em tudo?",
        opcoes: ["Porque gosta de brincar", "Porque quer dar sentido ao mundo", "Porque tem medo do desconhecido", "Porque quer ensinar os outros"],
        correta: 1,
        explicacao: "Bob usa etiquetas como forma de dar sentido ao mundo e se sentir seguro."
    },
    {
        pergunta: "O que o chapéu misterioso desperta em Bob?",
        opcoes: ["Alegria imediata", "Medo e curiosidade", "Tristeza profunda", "Indiferença"],
        correta: 1,
        explicacao: "O chapéu desperta medo pelo aviso e curiosidade pelo mistério."
    },
    {
        pergunta: "Quando os coelhos saltam do chapéu, o que eles trazem para a cena?",
        opcoes: ["Silêncio", "Caos divertido", "Medo real", "Tristeza"],
        correta: 1,
        explicacao: "Os coelhos trazem caos divertido e quebram a tensão do perigo."
    },
    {
        pergunta: "O crocodilo é visto como perigoso por quê?",
        opcoes: ["Por suas ações", "Por sua aparência", "Por estar no chapéu", "Por ser solitário"],
        correta: 1,
        explicacao: "Os animais julgam o crocodilo pela aparência escamosa e dentes afiados."
    },
    {
        pergunta: "O que a amizade entre Bob e o crocodilo ensina?",
        opcoes: ["Que amigos devem ser iguais", "Que diferenças não impedem amizade", "Que amizade é perigosa", "Que amizade deve ser evitada"],
        correta: 1,
        explicacao: "A amizade mostra que diferenças não impedem confiança e carinho."
    },
    {
        pergunta: "Qual é a lição dos coelhos para Bob?",
        opcoes: ["Que o inesperado pode ser bom", "Que etiquetas são mágicas", "Que chapéus são perigosos", "Que deve fugir sempre"],
        correta: 0,
        explicacao: "Os coelhos ensinam que o inesperado pode trazer alegria."
    },
    {
        pergunta: "O que o humor da história ajuda a mostrar?",
        opcoes: ["Que o medo pode ser ridículo", "Que o perigo é real", "Que etiquetas são corretas", "Que amizade é impossível"],
        correta: 0,
        explicacao: "O humor mostra que o medo pode ser exagerado e sem fundamento."
    },
    {
        pergunta: "Qual é a mensagem central do livro?",
        opcoes: ["Aceitar o inesperado e as diferenças", "Evitar chapéus misteriosos", "Rotular tudo corretamente", "Fugir dos animais diferentes"],
        correta: 0,
        explicacao: "A mensagem é aceitar o inesperado e respeitar as diferenças."
    },
    {
        pergunta: "O que Bob descobre sobre etiquetas?",
        opcoes: ["Que sempre dizem a verdade", "Que podem enganar", "Que são mágicas", "Que devem ser usadas sempre"],
        correta: 1,
        explicacao: "Bob descobre que etiquetas podem enganar e não definem a realidade."
    },
    {
        pergunta: "Por que o livro é indicado para crianças?",
        opcoes: ["Porque é engraçado", "Porque ensina valores", "Porque é curto", "Porque tem chapéus mágicos"],
        correta: 1,
        explicacao: "O livro ensina valores como amizade e aceitação de forma leve."
    },
    {
        pergunta: "O que o crocodilo simboliza na narrativa?",
        opcoes: ["O perigo real", "A diversidade e aceitação", "A confusão", "A liderança"],
        correta: 1,
        explicacao: "O crocodilo simboliza a diversidade e a importância de aceitar diferenças."
    },
    {
        pergunta: "Como Bob reage ao desconhecido inicialmente?",
        opcoes: ["Com medo", "Com alegria", "Com indiferença", "Com raiva"],
        correta: 0,
        explicacao: "Bob reage com medo ao desconhecido, acreditando no rótulo de perigo."
    },
    {
        pergunta: "O que os coelhos representam poeticamente?",
        opcoes: ["O caos sem sentido", "A surpresa da vida", "O perigo escondido", "A disciplina"],
        correta: 1,
        explicacao: "Os coelhos representam a surpresa da vida que pode ser alegre e positiva."
    },
    {
        pergunta: "Qual é o recurso narrativo mais usado para transmitir a lição?",
        opcoes: ["Suspense", "Humor", "Tristeza", "Violência"],
        correta: 1,
        explicacao: "O humor é usado para transmitir a lição de forma leve e acessível."
    },
    {
        pergunta: "O que a história ensina sobre julgamentos precipitados?",
        opcoes: ["Que são necessários", "Que podem ser injustos", "Que são sempre corretos", "Que devem ser incentivados"],
        correta: 1,
        explicacao: "A história ensina que julgamentos precipitados podem ser injustos."
    },
    {
        pergunta: "Qual é a importância das ilustrações na obra?",
        opcoes: ["Criam suspense", "Complementam o humor", "Substituem o texto", "Reforçam o medo"],
        correta: 1,
        explicacao: "As ilustrações complementam o humor e tornam a mensagem acessível."
    },
    {
        pergunta: "O que Bob aprende com sua experiência?",
        opcoes: ["Que deve parar de etiquetar", "Que nem tudo é perigoso", "Que chapéus são mágicos", "Que coelhos são perigosos"],
        correta: 1,
        explicacao: "Bob aprende que nem tudo é perigoso e que rótulos podem enganar."
    },
    {
        pergunta: "Qual é a relação entre humor e crítica social na obra?",
        opcoes: ["Humor neutraliza a crítica", "Humor reforça a crítica", "Humor substitui a crítica", "Humor ignora a crítica"],
        correta: 1,
        explicacao: "O humor reforça a crítica social ao mostrar como medos podem ser ridículos."
    },
    {
        pergunta: "O que a obra sugere sobre o desconhecido?",
        opcoes: ["Que deve ser evitado", "Que pode trazer alegria", "Que é sempre perigoso", "Que deve ser rotulado"],
        correta: 1,
        explicacao: "A obra sugere que o desconhecido pode trazer alegria e novas experiências."
    },
    {
        pergunta: "Qual é a mensagem filosófica mais profunda do livro?",
        opcoes: ["O mundo deve ser rotulado", "A realidade não pode ser definida por aparências", "O desconhecido é sempre perigoso", "A amizade só existe entre iguais"],
        correta: 1,
        explicacao: "A mensagem filosófica é que a realidade não pode ser definida apenas pelas aparências."
    }
]
;
        document.write('<form>'); questoes.forEach((q, i) => { document.write('<h3>' + (i + 1) + '. ' + q.pergunta + '</h3>'); q.opcoes.forEach((o, j) => document.write('<label><input type=radio name=q' + i + ' value=' + j + '>' + o + '</label><br>')); document.write('<div id=e' + i + '></div><hr>'); }); document.write('</form><button onclick="corrigir()">Finalizar basico</button><div id=res></div>'); function corrigir() { let p = 0; questoes.forEach((q, i) => { let r = document.querySelector('input[name=q' + i + ']:checked'); let e = document.getElementById('e' + i); if (r && +r.value === q.correta) { p++; e.innerHTML = '✅ ' + q.explicacao } else { e.innerHTML = '❌ ' + q.explicacao } }); document.getElementById('res').innerHTML = 'Acertos: ' + p + '/' + questoes.length; }
    </script>

    



</body>

</html>
