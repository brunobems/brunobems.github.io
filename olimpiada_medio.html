<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpíada de Literatura - Básico</title>
</head>

<body>
    <h1>🏆 Olimpíada de Literatura - Perigoso</h1>
    <p>Nível Médio - 20 questões</p>
    <script>
        const questoes = [
          
    {
        pergunta: "Por que Bob gosta tanto de etiquetar objetos?",
        opcoes: ["Para se divertir", "Para organizar o mundo", "Para ensinar os outros", "Para se proteger"],
        correta: 1,
        explicacao: "Bob usa etiquetas como forma de organizar e dar sentido ao mundo ao seu redor."
    },
    {
        pergunta: "O que a etiqueta 'PERIGO! NÃO TOQUE!' simboliza na história?",
        opcoes: ["Um aviso real", "O medo do desconhecido", "A curiosidade de Bob", "A amizade"],
        correta: 1,
        explicacao: "A etiqueta simboliza o medo do desconhecido e como rótulos podem enganar."
    },
    {
        pergunta: "Qual é a reação inicial de Bob ao ver os coelhos?",
        opcoes: ["Alegria", "Medo", "Indiferença", "Raiva"],
        correta: 1,
        explicacao: "Bob sente medo, acreditando que os coelhos são perigosos."
    },
    {
        pergunta: "O que os coelhos representam na narrativa?",
        opcoes: ["O perigo real", "A surpresa positiva", "A confusão", "A amizade"],
        correta: 1,
        explicacao: "Os coelhos representam o inesperado que pode ser positivo e divertido."
    },
    {
        pergunta: "Por que os outros animais consideravam o crocodilo perigoso?",
        opcoes: ["Por sua aparência", "Por suas ações", "Por ser solitário", "Por estar no chapéu"],
        correta: 0,
        explicacao: "Eles julgavam o crocodilo pela aparência escamosa e dentes afiados."
    },
    {
        pergunta: "Qual é a relação entre Bob e o crocodilo?",
        opcoes: ["São inimigos", "São amigos", "São rivais", "São desconhecidos"],
        correta: 1,
        explicacao: "Bob e o crocodilo são amigos e confiam um no outro."
    },
    {
        pergunta: "O que Bob aprende com os coelhos?",
        opcoes: ["Que etiquetas são inúteis", "Que o inesperado pode ser bom", "Que deve fugir", "Que chapéus são mágicos"],
        correta: 1,
        explicacao: "Bob aprende que o inesperado pode trazer alegria e não deve ser temido."
    },
    {
        pergunta: "Qual é o papel das etiquetas na história?",
        opcoes: ["Organizar", "Confundir", "Ensinar", "Proteger"],
        correta: 1,
        explicacao: "As etiquetas confundem Bob e mostram que nem sempre refletem a realidade."
    },
    {
        pergunta: "O que o crocodilo simboliza?",
        opcoes: ["O perigo real", "A diferença e aceitação", "A liderança", "A confusão"],
        correta: 1,
        explicacao: "O crocodilo simboliza a importância de aceitar as diferenças."
    },
    {
        pergunta: "Por que o livro é considerado humorístico?",
        opcoes: ["Pelos coelhos saltando", "Pelas etiquetas engraçadas", "Pelas falas de Bob", "Pelo crocodilo atrapalhado"],
        correta: 0,
        explicacao: "A cena dos coelhos saltando do chapéu traz humor e leveza."
    },
    {
        pergunta: "Qual é a crítica implícita do livro?",
        opcoes: ["Contra a curiosidade", "Contra os rótulos e preconceitos", "Contra os animais diferentes", "Contra a amizade"],
        correta: 1,
        explicacao: "O livro critica o hábito de rotular e julgar sem conhecer."
    },
    {
        pergunta: "Como Bob supera seu medo?",
        opcoes: ["Fugindo", "Observando os coelhos", "Confiando no crocodilo", "Usando etiquetas novas"],
        correta: 1,
        explicacao: "Bob percebe que os coelhos são inofensivos ao observá-los."
    },
    {
        pergunta: "Qual é a importância da amizade na história?",
        opcoes: ["Mostra confiança", "Mostra perigo", "Mostra confusão", "Mostra medo"],
        correta: 0,
        explicacao: "A amizade entre Bob e o crocodilo mostra confiança e aceitação."
    },
    {
        pergunta: "O que a reação dos animais ao crocodilo ensina?",
        opcoes: ["Que aparência define caráter", "Que preconceito pode ser injusto", "Que crocodilos são perigosos", "Que chapéus são mágicos"],
        correta: 1,
        explicacao: "Ensina que preconceito baseado em aparência é injusto."
    },
    {
        pergunta: "Qual é o recurso narrativo usado para ensinar a lição?",
        opcoes: ["Suspense", "Humor", "Tristeza", "Violência"],
        correta: 1,
        explicacao: "O humor é usado para transmitir a lição de forma leve."
    },
    {
        pergunta: "Por que o livro é indicado para crianças?",
        opcoes: ["Por ser curto", "Por ter ilustrações", "Por ensinar valores", "Por ser engraçado"],
        correta: 2,
        explicacao: "O livro ensina valores como amizade e aceitação de forma acessível."
    },
    {
        pergunta: "O que Bob percebe sobre etiquetas no final?",
        opcoes: ["Que são sempre certas", "Que podem enganar", "Que são inúteis", "Que são mágicas"],
        correta: 1,
        explicacao: "Bob percebe que etiquetas podem enganar e não devem definir tudo."
    },
    {
        pergunta: "Qual é a principal diferença entre Bob e os coelhos?",
        opcoes: ["Bob é organizado, os coelhos são caóticos", "Bob é medroso, os coelhos são corajosos", "Bob é curioso, os coelhos são indiferentes", "Bob é solitário, os coelhos são amigos"],
        correta: 0,
        explicacao: "Bob é organizado e metódico, enquanto os coelhos trazem caos e diversão."
    },
    {
        pergunta: "O que a história ensina sobre o desconhecido?",
        opcoes: ["Que deve ser evitado", "Que pode ser perigoso", "Que pode trazer alegria", "Que deve ser rotulado"],
        correta: 2,
        explicacao: "O desconhecido pode trazer alegria e novas experiências."
    },
    {
        pergunta: "Qual é a mensagem final do livro?",
        opcoes: ["Não confiar em chapéus", "Aceitar o inesperado e as diferenças", "Evitar coelhos", "Parar de etiquetar"],
        correta: 1,
        explicacao: "A mensagem final é aceitar o inesperado e respeitar as diferenças."
    }

 
   

        ];
        document.write('<form>'); questoes.forEach((q, i) => { document.write('<h3>' + (i + 1) + '. ' + q.pergunta + '</h3>'); q.opcoes.forEach((o, j) => document.write('<label><input type=radio name=q' + i + ' value=' + j + '>' + o + '</label><br>')); document.write('<div id=e' + i + '></div><hr>'); }); document.write('</form><button onclick="corrigir()">Finalizar basico</button><div id=res></div>'); function corrigir() { let p = 0; questoes.forEach((q, i) => { let r = document.querySelector('input[name=q' + i + ']:checked'); let e = document.getElementById('e' + i); if (r && +r.value === q.correta) { p++; e.innerHTML = '✅ ' + q.explicacao } else { e.innerHTML = '❌ ' + q.explicacao } }); document.getElementById('res').innerHTML = 'Acertos: ' + p + '/' + questoes.length; }
    </script>

    



</body>

</html>
